<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
    <style>
        table{
            width: 80%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: black;
            border: 2px solid red;
            background-color: beige;
        }
        img{
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Sno.</th>
                    <th>Title</th>
                    <th>Image</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="data">
    
            </tbody>
        </table>
    </div>
    <script>
        const ele = document.getElementById("data");
        const url = "https://dummyjson.com/products";
        async function load_product() {
            try{
                const res = await fetch(url);
                const data = await res.json();
                console.log("Data",data.products)
                let row="";
                data.products.map((i,index)=>{
                    row+=`
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src=${i.images[0]}></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                    </tr>
                    `;
                    ele.innerHTML = row;
                })
            }
            catch(err){
                console.log("Error",err);
            }

        };
        load_product();
    </script>
</body>
</html>
