<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const value= {
            Tea:100,
            coffee:500,
            AAta:600,
            Shugar:800
        }
        function Buynow(){
            item = prompt("Enter the product name:")
            quantity = prompt("Enter your counting:")
            price = value[item]*quantity
            document.getElementById("card1").innerHTML=`
            <div class="card1">
                <h2>Your Total Answer is =${price}</h2>
            </div>`
            document.querySelector("button").style.display="none"
            document.querySelector("div").style.display = "none"
        }

    </script>
    <div class="card">
        <h1 id="shop"><u>Online Shop</u></h1>
        <h3 class="value">Tea : 100</h3>
        <h3 class="value">coffee : 500</h3>
        <h3 class="value">AAta:600</h3>
        <h3 class="value">Shugar:800</h3>
      <center>  <button onclick="Buynow()">Buy Now</button></center>
      
    </div>
    <div id="card1"></div>
</body>
</html>
